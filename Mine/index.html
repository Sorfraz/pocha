<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Special Gift for You 🎁</title>
  <style>
    body {
      background-color: #fce4ec;
      font-family: 'Comic Sans MS', cursive, sans-serif;
      text-align: center;
      padding: 20px;
    }
    h1 {
      color: #d6336c;
      font-size: 2em;
    }
    .gift-box {
      width: 70vw;   /* responsive width */
      height: 70vw;  /* keep square shape */
      max-width: 250px;
      max-height: 250px;
      background: #ff4d6d;
      margin: 30px auto;
      border-radius: 20px;
      position: relative;
      box-shadow: 0 6px 12px rgba(0,0,0,0.3);
    }
    .ribbon-vertical {
      width: 20%;
      height: 100%;
      background: gold;
      position: absolute;
      left: 40%;
      top: 0;
    }
    .ribbon-horizontal {
      width: 100%;
      height: 20%;
      background: gold;
      position: absolute;
      top: 40%;
      left: 0;
    }
    /* Flower ribbon in the middle */
    .flower-ribbon {
      position: absolute;
      top: 40%;
      left: 40%;
      width: 20%;
      height: 20%;
      background: pink;
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5em;
      cursor: pointer;
      transition: transform 0.3s;
      text-decoration: none;
      color: #d6336c;
    }
    .flower-ribbon:hover {
      transform: scale(1.2) rotate(15deg);
      background: #ffb6c1;
    }

    /* Extra mobile adjustments */
    @media (max-width: 480px) {
      h1 {
        font-size: 1.5em;
      }
      .gift-box {
        width: 80vw;
        height: 80vw;
      }
      .flower-ribbon {
        font-size: 1.2em;
      }
    }
  </style>
</head>
<body>
  <h1>🎁 A Special Surprise Awaits You 🎁</h1>
  
  <div class="gift-box">
    <div class="ribbon-vertical"></div>
    <div class="ribbon-horizontal"></div>
    <!-- Flower ribbon clickable link -->
    <a href="valen.html" class="flower-ribbon" title="Open Gift">🌸</a>
  </div>
  
  <p>Tap the flower ribbon to unwrap your surprise 💖</p>
</body>
</html>
